group 'com.amazonaws.amplify.amplify_native_legacy_wrapper'
version '1.0-SNAPSHOT'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

// Apply the Kotlin plugin unless the consuming app has AGP's built-in Kotlin
// enabled (AGP 9+ with android.builtInKotlin=true), where applying it is an
// error. This keeps already-released versions of this package building across
// a future Flutter that turns built-in Kotlin on. Fully dropping the apply
// (built-in Kotlin migration, #7014) lands once the Flutter floor is 3.47+.
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0] as int
def builtInKotlin = project.findProperty('android.builtInKotlin')?.toString()?.toBoolean() ?: false
if (agpMajor < 9 || !builtInKotlin) {
    apply plugin: 'kotlin-android'
}

android {
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 24
    }

    namespace 'com.amazonaws.amplify.amplify_native_legacy_wrapper'
}
dependencies {
    implementation 'com.amplifyframework:core:2.39.0'
    implementation 'com.amplifyframework:core-kotlin:2.39.0'
    implementation 'com.amplifyframework:aws-auth-cognito:2.39.0'
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}
