name: amplify_event_enrichment_dart
description: A standalone Dart client that enriches analytics events with device, app, and session context, producing a structured JSON envelope.
version: 0.1.0
homepage: https://docs.amplify.aws/lib/q/platform/flutter/
repository: https://github.com/aws-amplify/amplify-flutter/tree/main/packages/amplify_event_enrichment/amplify_event_enrichment_dart
issue_tracker: https://github.com/aws-amplify/amplify-flutter/issues

topics:
  - aws
  - analytics
  - event-enrichment
  - aws-amplify

environment:
  sdk: ^3.11.0

dependencies:
  amplify_foundation_dart: ">=2.12.1 <2.13.0"
  aws_common: ">=0.7.15 <0.8.0"
  clock: ^1.1.1
  json_annotation: ^4.9.0
  meta: ^1.16.0
  uuid: ^4.5.1

dev_dependencies:
  amplify_lints: ">=3.1.6 <3.2.0"
  build_runner: ^2.4.15
  build_test: ^3.1.1
  fake_async: ^1.3.0
  json_serializable: ^6.11.0
  test: ^1.22.1
