plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    // The Compose compiler runs at the host app's Kotlin version; this is
    // only the minimum version of the Gradle plugin.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.0.0'
}

android {
    namespace 'com.amazonaws.amplify.aws_liveness'
    compileSdk 36

    defaultConfig {
        minSdkVersion 24
    }

    buildFeatures {
        compose = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.amplifyframework.ui:liveness:1.13.0'
    implementation 'androidx.activity:activity-compose:1.10.1'
}
