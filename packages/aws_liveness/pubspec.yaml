name: aws_liveness
description: A Flutter plugin for Amazon Rekognition Face Liveness on Android and iOS, built on the Amplify UI Face Liveness components.
version: 0.0.1
homepage: https://docs.amplify.aws/lib/q/platform/flutter/
repository: https://github.com/aws-amplify/amplify-flutter/tree/main/packages/aws_liveness
issue_tracker: https://github.com/aws-amplify/amplify-flutter/issues

topics:
  - aws
  - face-liveness
  - rekognition
  - aws-amplify

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  amplify_foundation_dart: ">=2.12.1 <2.13.0"
  flutter:
    sdk: flutter

dev_dependencies:
  amplify_lints: ">=3.1.6 <3.2.0"
  flutter_test:
    sdk: flutter
  pigeon: ^27.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.amazonaws.amplify.aws_liveness
        pluginClass: AwsLivenessPlugin
      ios:
        pluginClass: AwsLivenessPlugin
