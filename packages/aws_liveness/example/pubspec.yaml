name: aws_liveness_example
description: Demonstrates how to use the aws_liveness plugin.
publish_to: none

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  amplify_auth_cognito: any
  amplify_flutter: any
  amplify_foundation_dart: any
  aws_liveness:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  amplify_lints: ">=3.1.6 <3.2.0"
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    # Place your Amplify Gen2 `amplify_outputs.json` here. It is gitignored.
    - assets/
