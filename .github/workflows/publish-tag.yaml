name: Publish on Release Tag

on:
  push:
    tags:
      # aft release tags: <package>-v<version>, e.g. amplify_core-v2.6.1
      - '*-v[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  # `gh release create`; OIDC above still authenticates the pub.dev publish.
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2

      - name: Setup Dart
        uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1 # 1.8.0
        with:
          sdk: stable

      - name: Install aft
        run: dart pub global activate -spath packages/aft

      # aft resolves the tag to a package and reports its dart/flutter flavor.
      # `grep -o` drops any `pub`/SDK chatter that lands on stdout.
      - name: Resolve package
        id: package
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          TAG_VERSION="${TAG##*-v}"
          aft locate-package "$TAG" --format=env \
            | grep -oE '(name|version|path|flavor)=[^[:space:]]+' \
            > "$RUNNER_TEMP/package.env"
          . "$RUNNER_TEMP/package.env"
          : "${name:?aft reported no package name}"
          : "${version:?aft reported no package version}"
          : "${flavor:?aft reported no package flavor}"

          if [ "$version" != "$TAG_VERSION" ]; then
            echo "::error::Tag $TAG does not match $path/pubspec.yaml version $version"
            exit 1
          fi

          echo "package=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "flavor=$flavor" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Publishing $name $version ($flavor) from $path" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Flutter
        if: steps.package.outputs.flavor == 'flutter'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # 2.23.0
        with:
          channel: stable

      - name: Create publishing token (pub.dev)
        run: |
          set -eo pipefail
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          echo "PUB_TOKEN=${PUB_TOKEN}" >> $GITHUB_ENV
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var PUB_TOKEN

      # aft runs `dart pub publish` or `flutter pub publish` per package flavor.
      - name: Publish to pub.dev
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: aft publish --include "$PACKAGE" --force

      # Runs only once the publish succeeded, so a release never points at a
      # version which is missing from pub.dev.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.package.outputs.package }}
          VERSION: ${{ steps.package.outputs.version }}
          TAG: ${{ steps.package.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          NOTES="$RUNNER_TEMP/release_notes.md"
          # aft exits non-zero when the CHANGELOG has no entry for the version,
          # so the empty check below selects the fallback body.
          aft get-release-notes --package "$PACKAGE" --version "$VERSION" \
            | awk '/^Changelog:$/{f=1;next} f' > "$NOTES" || true
          if [ ! -s "$NOTES" ]; then
            echo "::warning::No changelog entry for $PACKAGE $VERSION"
            echo "Release $PACKAGE v$VERSION" > "$NOTES"
          fi

          gh release create "$TAG" \
            --title "$PACKAGE v$VERSION" \
            --notes-file "$NOTES" \
            --verify-tag
          echo "Created release $TAG" >> "$GITHUB_STEP_SUMMARY"
