name: Publish on Release Tag

on:
  push:
    tags:
      # aft release tags: <package>-v<version>, e.g. amplify_core-v2.6.1
      - '*-v[0-9]*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish to pub.dev
    permissions:
      contents: read
      id-token: write
    outputs:
      package: ${{ steps.package.outputs.package }}
      version: ${{ steps.package.outputs.version }}
      tag: ${{ steps.package.outputs.tag }}
      release_notes: ${{ steps.release.outputs.notes }}
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # 6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag commit is not on main"
            exit 1
          fi

      # Flutter bundles Dart, so this covers dart and flutter packages alike.
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # 2.23.0
        with:
          channel: stable

      - name: Install aft
        run: dart pub global activate -spath packages/aft

      # aft resolves the tag to a package in the workspace. Parse its exact
      # three-line output without evaluating it as shell code.
      - name: Resolve package
        id: package
        run: |
          set -eo pipefail
          fail() {
            echo "::error::$1"
            exit 1
          }

          TAG="${GITHUB_REF#refs/tags/}"
          metadata=$(aft locate-package "$TAG" --format=env)
          fields=()
          while IFS= read -r line; do
            fields+=("$line")
          done <<< "$metadata"
          [ "${#fields[@]}" -eq 3 ] \
            || fail "aft reported unexpected package metadata"

          [[ "${fields[0]}" =~ ^name=([a-z][a-z0-9_]*)$ ]] \
            || fail "aft reported an invalid package name"
          name=${BASH_REMATCH[1]}
          [[ "${fields[1]}" =~ ^version=([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$ ]] \
            || fail "aft reported an invalid package version"
          version=${BASH_REMATCH[1]}
          [[ "${fields[2]}" =~ ^path=([A-Za-z0-9._/-]+)$ ]] \
            || fail "aft reported an invalid package path"
          path=${BASH_REMATCH[1]}
          if [[ "$path" == /* ]] \
            || [[ "$path" == *"//"* ]] \
            || [[ "/$path/" == *"/../"* ]] \
            || [[ "/$path/" == *"/./"* ]]; then
            fail "aft reported an invalid package path"
          fi
          [ -f "$path/pubspec.yaml" ] \
            || fail "aft reported a package path without a pubspec"

          # aft publishes the pubspec's version, not the tag's, so a tag which
          # disagrees with it would publish a version nobody asked for.
          if [ "$version" != "${TAG##*-v}" ]; then
            echo "::error::Tag $TAG does not match $path/pubspec.yaml version $version"
            exit 1
          fi

          {
            echo "package=$name"
            echo "version=$version"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing $name $version from $path" >> "$GITHUB_STEP_SUMMARY"

      # Runbook parity: every fresh checkout links before publishing.
      - name: Link packages
        run: aft link

      # `aft publish` adds the pre-publish work plain `pub publish` skips: it
      # drops the `aft link` overrides, runs `pub upgrade`, and regenerates code
      # with `build_runner` — some published web workers exist only as its
      # output. It also tolerates this repo's known-benign pub warnings.
      - name: Publish to pub.dev
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
        run: |
          set -eo pipefail
          PUB_TOKEN=$(curl --retry 5 --retry-connrefused -sLS "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" -H "User-Agent: actions/oidc-client" -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" | jq -r '.value')
          echo "::add-mask::$PUB_TOKEN"
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          aft publish --include "$PACKAGE" --force

      - name: Prepare GitHub release
        id: release
        env:
          PACKAGE: ${{ steps.package.outputs.package }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          NOTES="$RUNNER_TEMP/release_notes.md"
          # aft exits non-zero when the CHANGELOG has no entry for the version,
          # so the empty check below selects the fallback body.
          aft get-release-notes --package "$PACKAGE" --version "$VERSION" \
            | awk '/^Changelog:$/{f=1;next} f' > "$NOTES" || true
          if [ ! -s "$NOTES" ]; then
            echo "::warning::No changelog entry for $PACKAGE $VERSION"
            echo "Release $PACKAGE v$VERSION" > "$NOTES"
          fi
          echo "notes=$(base64 -w 0 "$NOTES")" >> "$GITHUB_OUTPUT"

  release:
    name: Create GitHub release
    needs: publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Runs even when publishing was a no-op, so a re-run can still create a
      # release which is missing.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ needs.publish.outputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
          TAG: ${{ needs.publish.outputs.tag }}
          RELEASE_NOTES: ${{ needs.publish.outputs.release_notes }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, skipping"
            exit 0
          fi

          NOTES="$RUNNER_TEMP/release_notes.md"
          printf '%s' "$RELEASE_NOTES" | base64 --decode > "$NOTES"
          gh release create "$TAG" \
            --title "$PACKAGE v$VERSION" \
            --notes-file "$NOTES" \
            --verify-tag
          echo "Created release $TAG" >> "$GITHUB_STEP_SUMMARY"
